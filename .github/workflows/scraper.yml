name: Batch Movie Scraper & Database Sync

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Category / Source to scrape'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'vegamovies'
          - 'rogmovies'
          - 'xprimehub'
      mode:
        description: 'Scraping mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'custom'
      start_page:
        description: 'Start Page (Used in "custom" mode; leave blank to resume from history)'
        required: false
        default: ''
        type: string
      end_page:
        description: 'End Page (Used in "custom" mode; leave blank to use Page Count)'
        required: false
        default: ''
        type: string
      page_count:
        description: 'Number of pages to scrape per category (Used in "auto" mode)'
        required: false
        default: '10'
        type: string
      concurrency:
        description: 'Parallel worker count per page'
        required: false
        default: '5'
        type: choice
        options:
          - '3'
          - '5'
          - '8'
          - '10'
      request_delay:
        description: 'Delay between requests in milliseconds (polite scraping)'
        required: false
        default: '400'
        type: string
      custom_vegamovies_domain:
        description: 'Custom VegaMovies (Hollywood) domain override'
        required: false
        default: ''
        type: string
      custom_rogmovies_domain:
        description: 'Custom RogMovies (Bollywood) domain override'
        required: false
        default: ''
        type: string
      custom_xprime_domain:
        description: 'Custom XPrimeHub (Adult/18+) domain override'
        required: false
        default: ''
        type: string
      commit_changes:
        description: 'Commit and push updated database chunks & indexes to repository'
        required: true
        default: true
        type: boolean
      commit_message:
        description: 'Git commit message for database update'
        required: false
        default: '🤖 Auto-update movie database via GitHub Actions'
        type: string
      dry_run:
        description: 'Dry run mode (test run without writing/committing files)'
        required: false
        default: false
        type: boolean

  # Scheduled automatic run: runs daily at 02:00 UTC
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  scrape-and-sync:
    name: Run Batch Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Database Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Scraper Dependencies
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
          else
            npm install axios cheerio --no-audit --no-fund
          fi

      - name: Display Scraper Status & History
        run: |
          echo "=== Current Database State ==="
          ls -lh *-index.json scraper-history.json || true
          if [ -f scripts/bulk-scraper.js ]; then
            node scripts/bulk-scraper.js history || true
          fi

      - name: Execute Batch Scraper
        env:
          SOURCE: ${{ github.event.inputs.source || 'all' }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          START_PAGE: ${{ github.event.inputs.start_page || '' }}
          END_PAGE: ${{ github.event.inputs.end_page || '' }}
          PAGE_COUNT: ${{ github.event.inputs.page_count || '10' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '5' }}
          REQUEST_DELAY: ${{ github.event.inputs.request_delay || '400' }}
          VEGAMOVIES_DOMAIN: ${{ github.event.inputs.custom_vegamovies_domain || '' }}
          ROGMOVIES_DOMAIN: ${{ github.event.inputs.custom_rogmovies_domain || '' }}
          XPRIME_DOMAIN: ${{ github.event.inputs.custom_xprime_domain || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DATA_DIR: '.'
        run: |
          # Build arguments
          SCRAPER_ARGS="--source=${SOURCE} --concurrency=${CONCURRENCY} --delay=${REQUEST_DELAY} --data-dir=."

          if [ "${MODE}" = "custom" ] && [ -n "${START_PAGE}" ]; then
            SCRAPER_ARGS="${SCRAPER_ARGS} --start=${START_PAGE}"
            if [ -n "${END_PAGE}" ]; then
              SCRAPER_ARGS="${SCRAPER_ARGS} --end=${END_PAGE}"
            fi
          else
            # Auto mode: uses page count to crawl incrementally from history
            SCRAPER_ARGS="${SCRAPER_ARGS} --count=${PAGE_COUNT}"
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            SCRAPER_ARGS="${SCRAPER_ARGS} --dry-run"
          fi

          echo "Running: node scripts/bulk-scraper.js ${SCRAPER_ARGS}"
          node scripts/bulk-scraper.js ${SCRAPER_ARGS}

      - name: Commit and Push Database Updates
        if: ${{ (github.event.inputs.commit_changes != 'false') && (github.event.inputs.dry_run != 'true') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add modified database files
          git add *-index.json scraper-history.json hollywood/ bollywood/ xprimehub/

          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected. Database is already up to date."
          else
            COMMIT_MSG="${{ github.event.inputs.commit_message || '🤖 Auto-update movie database via GitHub Actions' }}"
            git commit -m "${COMMIT_MSG}"
            
            # Pull latest changes if any to prevent reject
            git pull --rebase origin main || true
            git push origin main
            echo "✅ Successfully committed and pushed updates to main branch!"
          fi

      - name: Generate Summary Report
        if: always()
        run: |
          echo "## 📊 Scraper Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Source** | \`${{ github.event.inputs.source || 'all' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mode** | \`${{ github.event.inputs.mode || 'auto' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Page Count / Range** | \`${{ github.event.inputs.page_count || '10' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Concurrency** | \`${{ github.event.inputs.concurrency || '5' }}\` workers |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dry Run** | \`${{ github.event.inputs.dry_run || 'false' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f scraper-history.json ]; then
            echo "### 📈 Latest Progress in History" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat scraper-history.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
